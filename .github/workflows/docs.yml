name: Documentation

on:
  push:
    branches: ['**']
    paths:
      - 'docs/**'
      - '!docs/analysis/**'
      - 'materials/**'
      - 'teaching/**'
      - 'scripts/**'
      - 'site.yml'
      - 'package*.json'
      - 'requirements-course.txt'
      - 'generate-jupyter.sh'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - '!docs/analysis/**'
      - 'materials/**'
      - 'teaching/**'
      - 'scripts/**'
      - 'site.yml'
      - 'package*.json'
      - 'requirements-course.txt'
      - 'generate-jupyter.sh'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-24.04
    name: Build and verify course site
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: requirements-course.txt
    - name: Install documentation and course dependencies
      run: |
        npm ci
        python -m pip install -r requirements-course.txt
    - name: Check inventory and static preview without numerical execution
      run: |
        python scripts/inventory-sources.py --check
        COURSE_PYTHON=/does/not/exist npm run site:static
        python scripts/verify-course-site.py --static
    - name: Build executable Antora pages and notebook downloads
      run: npm run validate
    - name: Verify released practicals, notes and course links
      run: |
        python scripts/verify-session01.py
        python scripts/verify-reduced-models.py
        python scripts/verify-course-site.py
        python scripts/package-course.py
    - uses: actions/upload-artifact@v4
      with:
        name: course-site
        path: public/
        if-no-files-found: error
  deploy_docs:
    runs-on: ubuntu-24.04
    name: Publish course site
    needs: docs
    if: github.event_name == 'push' && github.ref_name == 'master'
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        name: course-site
        path: public/
    - uses: JamesIves/github-pages-deploy-action@v4
      with:
        branch: gh-pages
        folder: public
